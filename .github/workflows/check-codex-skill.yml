name: Check Codex Skill

on:
  pull_request:
    paths:
      - 'codex-skill/**'
      - 'cli-anything-plugin/**'
      - 'docs/PREVIEW_PROTOCOL.md'
      - '.github/workflows/check-codex-skill.yml'
  push:
    branches:
      - main
    paths:
      - 'codex-skill/**'
      - 'cli-anything-plugin/**'
      - 'docs/PREVIEW_PROTOCOL.md'
      - '.github/workflows/check-codex-skill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-installer:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","onlyarag-cli-anything-x64"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Codex skill installer
        run: bash codex-skill/tests/test_install.sh
